- name: User enumeration blocked
  request:
    method: GET
    url: https://www.ethyrealbio.com/wp-json/wp/v2/users
  response:
    status: 403
    body:
      code: aios_user_lists_forbidden
      message: Listing users is forbidden.
      data:
        status: 403
  teaching_point: >-
    A plugin-specific code, not WordPress core. This route is permanently closed, not
    temporarily throttled.
- name: Cloudflare bot challenge (NOT a JSON error)
  request:
    method: GET
    url: https://www.ethyrealbio.com/wp-json/
    note: Sent with a non-browser User-Agent.
  response:
    status: 403
    headers:
      Content-Type: text/html; charset=UTF-8
      Server: cloudflare
    body: '<!DOCTYPE html> … <title>Attention Required! | Cloudflare</title> …'
  teaching_point: >-
    The single most important failure mode on this host. A 403 here may be HTML from the edge
    rather than the WordPress JSON envelope, and the same URL returns 200 on retry with a
    browser User-Agent. Branch on Content-Type before parsing any error.
