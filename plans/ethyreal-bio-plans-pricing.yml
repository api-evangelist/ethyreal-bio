note: >-
  Ethyreal Bio publishes NO plans, NO pricing and NO commercial API offering — not a free tier,
  not an enterprise "contact us" gate, nothing. There is no pricing page and no sign-up or login
  surface on ethyrealbio.com; the site has ten pages and none of them sell anything. This is the
  expected result for a pre-commercial clinical-stage biotechnology company: its lead program
  ETHY-001 is an investigational antibody that had not entered first-in-human trials at the time
  of this pass, so the company has no product revenue of any kind, let alone API revenue.
  The WordPress REST API catalogued in this repository is an unmetered, unauthenticated
  side-effect of how the marketing site is built, not a product. No Pricing, SignUp or Login
  pointer was written into apis.yml because no such page exists to point at.
