  and it does not. There is no separate API host: api.ethyrealbio.com, docs.ethyrealbio.com, developer.ethyrealbio.com,
  mcp.ethyrealbio.com, trust.ethyrealbio.com, security.ethyrealbio.com and status.ethyrealbio.com are
  all NXDOMAIN, so ethyrealbio.com (and its www alias, a CNAME to WP Engine) is the only host with a discovery
  surface to probe.'
