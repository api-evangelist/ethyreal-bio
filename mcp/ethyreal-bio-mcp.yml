note: >-
  Ethyreal Bio publishes NO MCP server. The route index at https://www.ethyrealbio.com/wp-json/
  advertises 14 namespaces and none of them is "mcp"; /.well-known/mcp.json returns 404; and
  mcp.ethyrealbio.com is NXDOMAIN. The tool list below is a CANDIDATE derived by API Evangelist
  from the read operations in openapi/ — it describes what an MCP server over this content
  surface could expose, not something the company serves.
  Because nothing is served, NO MCPServer pointer was written into apis.yml: that pointer
  asserts the provider runs an MCP endpoint, and emitting it for a candidate would credit
  Ethyreal Bio with an agent surface it does not have. For the same reason no tool crosswalk was
  written — a crosswalk records divergence between a real MCP surface and a real REST surface,
  and here only one of the two exists.
adjacent_surface:
  name: WordPress Abilities API
  path: /wp-json/wp-abilities/v1/abilities
  status: 401
  gated: true
  description: >-
    The wp-abilities/v1 namespace IS present in the route index. It is the ability registry that
    a WordPress MCP adapter would project as tools, and its presence means the site runs a
    WordPress new enough to carry it — but it is not itself an MCP endpoint, and an anonymous
    GET returns 401 rest_forbidden, so the registered abilities could not be enumerated. Reading
    it would require an Application Password that Ethyreal Bio does not issue publicly.
  companion_routes:
  - path: /wp-json/wp-abilities/v1/categories
    status: 401
  - path: /wp-json/wp-abilities/v1/abilities/{name}/run
    status: 401
    note: The execution route. Gated, and never exercised by this pipeline.
