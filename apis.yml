aid: ethyreal-bio
name: Ethyreal Bio
description: 'Ethyreal Bio is a Cambridge, Massachusetts clinical-stage biotechnology
  company founded in 2024 and headquartered at 700 Technology Square, developing precision
  therapies for thyroid diseases with high unmet need. It emerged from stealth on 10 June
  2026 with $101 million in combined Series A and Series B financing — the Series A co-led
  by Atlas Venture and Medicxi alongside Nandi Life Sciences and Checkpoint Capital, the
  Series B led by Avoro Capital. Its lead program ETHY-001 is a monoclonal antibody that
  blocks autoantibody-mediated activation of the thyroid stimulating hormone receptor
  (TSHR), the shared pathogenic driver of Graves'' disease and thyroid eye disease; it is
  formulated for subcutaneous administration with half-life extension technology for
  infrequent dosing, and first-in-human trials were planned for the second half of 2026.
  Ethyreal Bio publishes no developer program, no product API, no SDKs and no OpenAPI
  definition of its own. The only machine-readable surface on ethyrealbio.com is the
  WordPress REST API (wp/v2) that the company website exposes at /wp-json/, which serves
  its press releases, corporate pages, leadership and board-of-directors profiles, media
  library, taxonomies and site search as JSON. The OpenAPI documents in this repository
  were derived mechanically by API Evangelist from that route-discovery descriptor.'
