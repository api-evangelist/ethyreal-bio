format: wp-error
format_note: >-
  Ethyreal Bio's content API does NOT use RFC 9457 problem+json. Every error is the WordPress
  WP_Error envelope serialized to application/json — a flat object of {code, message, data} where
  data.status carries the HTTP status. There is no `type` URI, no `title`, no `detail` and no
  problem+json content type, so an agent cannot dereference an error to documentation. The
  machine-readable discriminator is the string in `code`.
envelope:
  content_type: application/json
  fields:
  - field: code
    type: string
    description: Machine-readable error code. This is the only stable discriminator.
  - field: message
    type: string
    description: Human-readable message, localized to the site language.
  - field: data.status
    type: integer
    description: The HTTP status, repeated inside the body.
  - field: data.params
    type: object
    description: Present on rest_invalid_param only — a map of parameter name to the violated rule.
  - field: data.details
    type: object
    description: >-
      Present on rest_invalid_param only — a per-parameter nested WP_Error with its own code
      (e.g. rest_out_of_bounds).
