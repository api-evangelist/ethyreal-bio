de_facto_throttle:
  mechanism: cloudflare-bot-management
  status_code: 403
  content_type: text/html
  body: Cloudflare "Attention Required!" interstitial
  observed: true
  evidence:
  - url: https://www.ethyrealbio.com/wp-json/
    status: 403
    note: Returned mid-session on a path that had returned 200 moments earlier.
  - url: https://www.ethyrealbio.com/feed/
    status: 403
    note: Returned 200 on retry with a browser User-Agent.
  description: >-
    The effective limiter is Cloudflare bot management in front of WP Engine, not an API quota.
    It is triggered by client fingerprint rather than request volume — a non-browser User-Agent
    is challenged where a browser User-Agent on the same path succeeds. There is no header that
    announces it, no Retry-After telling a client how long to wait, and the 403 body is HTML,
    so a JSON client will fail to parse the error as well as fail the request.
  consequence_for_agents: >-
    An automated consumer cannot distinguish "you are over quota" from "you are blocked as a
    bot" from "you lack permission" — all three are 403. Back off on any 403 whose content-type
    is not application/json, and treat it as a client-identity problem rather than a quota one.
