- target: $.info
  description: Record the observed runtime hazards a generated client will not learn from the spec.
  update:
    x-apievangelist-runtime-hazards:
    - id: cloudflare-bot-challenge
      description: >-
        A 403 from this host may be a Cloudflare HTML interstitial rather than the WordPress
        JSON error envelope. Branch on Content-Type before parsing an error body, and retry
        with a browser User-Agent.
    - id: no-idempotency
      description: >-
        No Idempotency-Key or equivalent exists. A retried write creates a duplicate resource.
    - id: no-rate-limit-signal
      description: >-
        No RateLimit-* or Retry-After headers are returned. There is no runtime budget signal.
    - id: rendered-html-fields
      description: >-
        title.rendered, content.rendered and excerpt.rendered contain entity-escaped HTML, not
        plain text.
    - id: dangling-author-reference
      description: >-
        posts.author references /wp/v2/users, which returns 403 aios_user_lists_forbidden to
        anonymous callers, so the reference cannot be dereferenced.
- target: $.paths['/wp/v2/posts'].get
  description: Name what the posts collection actually holds on this site.
  update:
    x-apievangelist-content: >-
      Company press releases. Two were published as of 2026-08-12 (X-WP-Total 2): the 10 June
      2026 emergence-from-stealth announcement and the 15 June 2026 ENDO 2026 preclinical data
      release for ETHY-001.
- target: $.paths['/wp/v2/team_member'].get
  description: Name what the team_member collection actually holds.
  update:
    x-apievangelist-content: >-
      Ten leadership and board-of-directors profiles, grouped by the team_group taxonomy into
      Leadership (4) and Board of Directors (7).
- target: $.paths['/wp/v2/users'].get
  description: Record the observed closure of the users collection.
  update:
