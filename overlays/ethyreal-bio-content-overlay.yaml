    x-apievangelist-observed-status: 403
    x-apievangelist-observed-code: aios_user_lists_forbidden
    x-apievangelist-note: >-
      Closed by the All-In-One Security plugin, which returns its own error code rather than the
      WordPress default. Treat as permanently unavailable.
- target: $.paths['/wp/v2/settings'].get
