source: >-
  openapi/_original/ethyreal-bio-content-openapi.yml route parameters and id-reference fields,
  confirmed against live responses from https://www.ethyrealbio.com/wp-json/wp/v2 on 2026-08-12.
note: >-
  The WordPress REST route descriptor declares parameters but not response schemas, so the
  entity shapes below were confirmed by reading real responses rather than inferred from the
  spec alone. Counts are the X-WP-Total observed on 2026-08-12.
identifiers:
  style: integer
  note: >-
    Every entity is keyed by a positive integer `id`, unique per post type or taxonomy. There
    are no prefixed or namespaced ids. Entities also carry a URL-safe `slug` that is unique
    within its collection and is the stable human-facing key; `link` is the canonical public URL.
entities:
- name: post
  route: /wp/v2/posts
  tag: News
  count: 2
  description: >-
    Company press releases. This is the substantive content on the site — the 10 June 2026
    emergence-from-stealth announcement and the 15 June 2026 ENDO 2026 preclinical data release
    for ETHY-001.
  key_fields:
  - id
  - date / date_gmt / modified
  - slug
  - link
  - title.rendered
  - content.rendered
  - excerpt.rendered
  - categories[]
  - tags[]
  - author
  - featured_media
- name: page
  route: /wp/v2/pages
  tag: Pages
  count: 10
  description: >-
    Corporate pages: Home, About Us, Our Program, Disease Areas, Patients, News, Contact,
    Expanded Access Policy, Terms of Use, Privacy Policy.
  key_fields: [id, slug, link, title.rendered, content.rendered, parent, menu_order]
- name: team_member
  route: /wp/v2/team_member
  tag: People
  count: 10
  description: >-
    Leadership and board-of-directors profiles — the custom post type registered by the Avada
    theme. Carries name, credentials and biography as rendered HTML.
  key_fields: [id, slug, link, title.rendered, content.rendered, team_group, featured_media]
- name: team_group
  route: /wp/v2/team_group
  tag: People
  count: 2
  taxonomy: true
  description: >-
    The taxonomy that groups team members. Two terms are published: "Leadership" (4 members) and
    "Board of Directors" (7 members) — eleven assignments across ten people, so at least one
    person sits in both.
  key_fields: [id, name, slug, count]
- name: media
  route: /wp/v2/media
  tag: Media
  count: 57
  description: >-
    The media library — leadership and board headshots, the site logo, hero artwork and program
    imagery. Each item exposes source_url plus a media_details.sizes map of generated renditions.
  key_fields: [id, slug, source_url, mime_type, alt_text, media_details.sizes, post]
- name: category
  route: /wp/v2/categories
  tag: Taxonomy
  count: 3
  taxonomy: true
  description: >-
    Post categories. "News" (id 20) carries the press releases; the other two are the unused
