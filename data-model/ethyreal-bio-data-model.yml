traversal:
  hypermedia: >-
    Every relationship is also expressed as a URL in the resource's _links object, and ?_embed
    inlines the targets under _embedded — one request instead of N+1. Prefer _embed over
    following ids by hand.
  search_index:
    route: /wp/v2/search
    note: >-
      Returns a flattened {id, title, url, type, subtype} projection across posts, pages, team
      members and taxonomy terms, with _links.self pointing back at the full resource. This is
      the cheapest entry point for an agent that does not already know the shape of the site.
