  key_fields: [id, name, slug, count, parent]
- name: tag
  route: /wp/v2/tags
  tag: Taxonomy
  count: 0
  taxonomy: true
  description: Post tags. Registered but unused — no terms are published.
- name: comment
  route: /wp/v2/comments
  tag: Comments
