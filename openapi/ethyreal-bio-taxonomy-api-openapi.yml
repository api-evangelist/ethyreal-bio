openapi: 3.2.0
info:
  title: Ethyreal Bio Content API (WordPress REST wp/v2) Taxonomy API
  version: wp/v2
  summary: 'Public read surface of ethyrealbio.com content: press releases and news, corporate pages including the
    Expanded Access Policy and Terms of Use, leadership and board-of-directors profiles, the media library, taxonomies
    and site-wide search.'
  description: 'Ethyreal Bio publishes www.ethyrealbio.com on WordPress (Avada theme, WP Engine hosting), which
    exposes the WordPress REST API at https://www.ethyrealbio.com/wp-json/. The wp/v2 namespace is anonymously readable
    and returns the company''s press releases (`posts`), corporate pages (`pages`), leadership and board profiles
    (`team_member`, grouped by `team_group`), the media library, FAQ and portfolio custom post types, taxonomies
    and a site-wide search endpoint as JSON.


    This document was DERIVED mechanically by API Evangelist from the route-discovery document served at https://www.ethyrealbio.com/wp-json/
    on 2026-08-12 — every path, method and parameter below is taken verbatim from that descriptor. Ethyreal Bio
    does not publish an OpenAPI definition of its own, and this is not a product API: it is the content API the
    CMS exposes. Ethyreal Bio is a clinical-stage biotechnology company and ships no developer program, no API product
    and no SDKs. Write operations exist on these routes but require authentication (WordPress Application Passwords
    over HTTP Basic); `/wp/v2/users` returns 403 and `/wp/v2/settings` returns 401 anonymously.'
  contact:
    name: Ethyreal Bio
    url: https://www.ethyrealbio.com/
  x-derived-by: API Evangelist enrichment pipeline
  x-derived-from: https://www.ethyrealbio.com/wp-json/
  x-derived-on: '2026-08-12'
  x-provider-published: false
