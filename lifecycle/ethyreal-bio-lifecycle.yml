stability_assessment:
  stability: incidental
  breaking_change_risk: high
  reasoning: >-
    This surface is not a product and nobody at Ethyreal Bio is treating it as an interface with
    consumers. Its shape is determined by the WordPress version, the Avada theme's registered
    custom post types (team_member, avada_faq, avada_portfolio) and the installed plugin set —
    a theme change, a plugin change or a security-plugin policy change can add, remove or close
    routes with no notice, no version bump and no announcement. The All-In-One Security plugin
    already closes /wp/v2/users with a non-core error code, which demonstrates that route
    availability here is a site-administration decision rather than an API contract.
  advice: >-
    Re-read the route index at https://www.ethyrealbio.com/wp-json/ before each run rather than
    trusting a cached spec, and treat any route disappearing as expected behaviour.
